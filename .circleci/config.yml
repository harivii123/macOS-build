version: 2.1

jobs:
  build-macos-finance-summary:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium

    steps:
      - checkout

      - run:
          name: Show macOS and Python versions
          command: |
            sw_vers
            python3 --version

      - run:
          name: Build FinanceSummary
          command: |
            chmod +x build_macos_create_executable_here.sh
            ./build_macos_create_executable_here.sh

            echo "Checking output:"
            ls -lah FinanceSummary
            file FinanceSummary

            chmod +x FinanceSummary
            tar -czf FinanceSummary-macos-arm64.tar.gz FinanceSummary

      - store_artifacts:
          path: FinanceSummary-macos-arm64.tar.gz
          destination: FinanceSummary-macos-arm64.tar.gz

workflows:
  build:
    jobs:
      - build-macos-finance-summary
